# Publishes a wheel as a GitHub release asset on each pushed v* tag, so a
# project whose installs check hashes (eg uv pip --require-hashes) can pin
# path_coverage by the wheel's URL and sha256. A git+ URL has no hash, so
# such an install refuses it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The tag names the version the wheel carries, which version.py
      # holds; a tag naming another version would publish a mislabelled
      # wheel.
      - name: Check the tag names version.py's version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/path_coverage/version.py)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} is not v${version}, the version in src/path_coverage/version.py" >&2
            exit 1
          fi

      - name: Run the tests
        run: |
          python -m pip install pytest pytest-cov 'coverage>=7.15,<8'
          PYTHON=python bash bin/test.sh

      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wheel=$(ls dist/*.whl)
          sha=$(sha256sum "${wheel}" | cut -d ' ' -f 1)
          gh release create "${GITHUB_REF_NAME}" "${wheel}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "$(basename "${wheel}") sha256:${sha}"
