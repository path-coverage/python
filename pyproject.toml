[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "path_coverage"
version = "0.0.1"
description = "Path coverage for Python: the paths taken within each decision, and within each method"
requires-python = ">=3.13"
readme = "README.md"
authors = [{ name = "Jon Jagger" }]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "coverage>=7.15,<8"]

[project.scripts]
path_coverage_collector = "path_coverage.collector:command"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
path_coverage = ["html/*"]

[tool.pytest.ini_options]
testpaths = ["test"]

# Line and branch coverage of src/ and test/, as bin/test.sh measures them
# beside path coverage; the projects the tests run, and the self-coverage
# plugin, are no code of path_coverage's.
[tool.coverage.run]
branch = true
source = ["src/path_coverage", "test"]
data_file = "reports/.coverage"
# The collector's command runs in a process of its own in its tests.
patch = ["subprocess"]
omit = ["*/test/projects/*", "*/test/self_coverage.py"]

[tool.coverage.report]
# Every line and every branch of src/ and test/ runs, or the run fails.
fail_under = 100

[tool.coverage.json]
output = "reports/coverage.json"
