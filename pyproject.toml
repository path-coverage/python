[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "path_coverage"
version = "0.0.1"
description = "Path coverage for Python: the paths taken through each decision, and across each function's decisions"
requires-python = ">=3.13"
readme = "README.md"
authors = [{ name = "Jon Jagger" }]

[project.scripts]
path_coverage_collector = "path_coverage.collector:command"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
path_coverage = ["html/*"]

[tool.pytest.ini_options]
testpaths = ["test"]
